services:
  sf_postgres:
    image: postgres:17-bullseye
    container_name: sf_postgres
    ports:
      - "${PG_PORT}:${PG_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/sql/boilerplate.sql:/docker-entrypoint-initdb.d/boilerplate.sql # will setup boilerplate data for us
      - ./dockerConfig/postgres-dev-init.sql:/docker-entrypoint-initdb.d/init.sql # will setup dev database adonis_app for us
    env_file:
      - ./.env

  sf_backend:
    build:
      context: .
      target: dependencies
      dockerfile: Dockerfile
    container_name: sf_backend
    command: ./dockerConfig/run.sh
    restart: unless-stopped
    depends_on:
      sf_postgres:
        condition: service_healthy # this will ensure that the database is up and running before starting the backend
      mqtt_broker:
        condition: service_started # this will ensure that the MQTT broker is up and running before starting the backend
      mailhog:
        condition: service_started # this will ensure that the MailHog is up and running before starting the backend
    ports:
      - ${PORT}:${PORT}
      - 9229:9229
    environment:
      PG_HOST: ${PG_HOST}
      TZ: ${TZ}
    env_file:
      - ./.env
    volumes:
      - ./:/home/node/app
      - ./dockerConfig/run.sh:/home/node/app/dockerConfig/run.sh
      - /home/node/app/node_modules
      # This volueme is used to persist the state of seeders and migrations
      - adonis_state:/home/node/app/adonis_state

  # MQTT Password Generator Service (runs once to create password file)
  mqtt_broker:
    image: eclipse-mosquitto:2.0.21
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    entrypoint: >
      sh -c "
        # Create password file if it doesn't exist
        if [ ! -f /mosquitto/config/pwdfile ]; then
          echo 'Creating password file...'
          touch /mosquitto/config/pwdfile
          if [ -n \"$MQTT_USERNAME\" ] && [ -n \"$MQTT_PASSWORD\" ]; then
            mosquitto_passwd -b /mosquitto/config/pwdfile $MQTT_USERNAME $MQTT_PASSWORD
            echo 'Password file created with user: $MQTT_USERNAME'
          else
            mosquitto_passwd -b /mosquitto/config/pwdfile admin admin
            echo 'Password file created with default admin:admin credentials'
          fi
        fi
        # Start mosquitto
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      "
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-admin}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 mosquitto_pub -h localhost -t test -m 'health check' -u ${MQTT_USERNAME:-admin} -P ${MQTT_PASSWORD:-admin} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025" # Port SMTP
      - "8025:8025" # Port Web UI
    restart: unless-stopped

volumes:
  postgres-data:
  adonis_state:
  mosquitto-data:
  mosquitto-logs:
