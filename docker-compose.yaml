services:
  sf_postgres:
    image: postgres:17-bullseye
    container_name: sf_postgres
    ports:
      - "${PG_PORT}:${PG_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/sql/boilerplate.sql:/docker-entrypoint-initdb.d/boilerplate.sql # will setup boilerplate data for us
      - ./dockerConfig/postgres-dev-init.sql:/docker-entrypoint-initdb.d/init.sql # will setup dev database adonis_app for us
    env_file:
      - ./.env

  sf_backend:
    build:
      context: .
      target: dependencies
      dockerfile: Dockerfile
    container_name: sf_backend
    command: ./dockerConfig/run.sh
    restart: always
    depends_on:
      sf_postgres:
        condition: service_healthy # this will ensure that the database is up and running before starting the backend
    ports:
      - ${PORT}:${PORT}
      - 9229:9229
    environment:
      PG_HOST: ${PG_HOST}
      TZ: ${TZ}
    env_file:
      - ./.env
    volumes:
      - ./:/home/node/app
      - ./dockerConfig/run.sh:/home/node/app/dockerConfig/run.sh
      - /home/node/app/node_modules

volumes:
  postgres-data:
